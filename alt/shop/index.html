<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Accent Tiles — Foundry Art [Plus]</title>
<meta name="theme-color" content="#1A1814">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231A1814'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='400' fill='%23C9A84C' text-anchor='middle'%3EFA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="shop">

  <div data-nav></div>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="/alt/">Home</a><span class="sep">/</span><span class="current">Shop</span>
  </nav>

  <main class="page">
    <header class="page-header">
      <p class="section-eyebrow">Accent Tiles</p>
      <h1 class="page-title">Shop the Collection</h1>
      <p class="page-sub">Hand-cast solid bronze. Traditional and white bronze finishes. 1×1, 2×2, and 3×3 formats.</p>
    </header>

    <div class="shop-layout">
      <aside class="shop-sidebar" aria-label="Filters and categories">

        <div class="facet-group">
          <h5>Category</h5>
          <ul class="facet-list">
            <li><label><input type="checkbox" id="cat-insets" data-label="Insets"> Insets <span class="count">10</span></label></li>
            <li><label><input type="checkbox" id="cat-liners" data-label="Liners"> Liners <span class="count">0</span></label></li>
            <li><label><input type="checkbox" id="cat-knobs" data-label="Knobs &amp; Pulls"> Knobs &amp; Pulls <span class="count">1</span></label></li>
            <li><label><input type="checkbox" id="cat-sale" data-label="On Sale"> On Sale <span class="count">4</span></label></li>
          </ul>
        </div>

        <div class="facet-group">
          <h5>Size</h5>
          <ul class="facet-list">
            <li><label><input type="checkbox" id="size-3" data-label="3×3 inch"> 3×3 inch <span class="count">7</span></label></li>
            <li><label><input type="checkbox" id="size-2" data-label="2×2 inch"> 2×2 inch <span class="count">2</span></label></li>
            <li><label><input type="checkbox" id="size-1" data-label="1×1 inch"> 1×1 inch <span class="count">2</span></label></li>
          </ul>
        </div>

        <div class="facet-group">
          <h5>Finish</h5>
          <div class="facet-swatches">
            <span class="facet-swatch">
              <span class="swatch-chip traditional" aria-hidden="true"></span>
              <span>Traditional</span>
              <input type="checkbox" hidden id="fin-trad" data-label="Traditional Bronze">
            </span>
            <span class="facet-swatch">
              <span class="swatch-chip white" aria-hidden="true"></span>
              <span>White</span>
              <input type="checkbox" hidden id="fin-wht" data-label="White Bronze">
            </span>
          </div>
        </div>

        <div class="facet-group">
          <h5>Price</h5>
          <div class="facet-price-range">
            <input type="number" placeholder="Min" min="0">
            <span>—</span>
            <input type="number" placeholder="Max" min="0">
            <button type="button" class="btn-secondary" style="padding:6px 12px;font-size:9px;">Go</button>
          </div>
          <p style="font-size:10px;color:var(--mid);margin-top:8px;">$42 – $92.50</p>
        </div>

        <div class="facet-group">
          <h5>Pattern</h5>
          <ul class="facet-list">
            <li><label><input type="checkbox" id="pat-cab" data-label="Cabochon"> Cabochon <span class="count">4</span></label></li>
            <li><label><input type="checkbox" id="pat-lot" data-label="Lotus"> Lotus <span class="count">1</span></label></li>
            <li><label><input type="checkbox" id="pat-mb"  data-label="Moon Blossom"> Moon Blossom <span class="count">1</span></label></li>
            <li><label><input type="checkbox" id="pat-sun" data-label="Sun"> Sun <span class="count">1</span></label></li>
            <li><label><input type="checkbox" id="pat-grd" data-label="Grid"> Grid <span class="count">1</span></label></li>
            <li><label><input type="checkbox" id="pat-pin" data-label="Pinwheel"> Pinwheel <span class="count">1</span></label></li>
          </ul>
        </div>

      </aside>

      <div class="shop-main">
        <div class="shop-toolbar">
          <span class="shop-result-count">Showing <strong>11</strong> of 11 results</span>
          <div class="shop-sort">
            <label for="sort">Sort</label>
            <select id="sort">
              <option>Best match</option>
              <option>Popularity</option>
              <option>Newest</option>
              <option>Price: low to high</option>
              <option>Price: high to low</option>
            </select>
          </div>
        </div>

        <div class="active-filter-chips" aria-label="Active filters">
          <!-- populated by app.js when filters are checked -->
        </div>

        <div class="shop-grid" data-shop-grid>
          <!-- rendered by app.js -->
        </div>

        <nav class="pagination" aria-label="Pagination">
          <span class="current">1</span>
          <a href="#">2</a>
          <a href="#">Next →</a>
        </nav>
      </div>
    </div>
  </main>

  <div data-footer></div>

  <script src="/assets/products.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
