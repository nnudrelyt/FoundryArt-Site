<!DOCTYPE html>

<head>

<body data-page="account-dashboard" data-account>

  <div data-nav></div>

  <main class="page">
    <header class="page-header">
      <h1 class="page-title"><span data-account-hello>Your account</span></h1>
      <p class="page-sub">Signed in as <span data-account-email></span></p>
    </header>

    <div class="account-layout">
      <nav class="account-nav" aria-label="Account">
        <a href="/foundry-art/account/" class="active">Overview</a>
        <a href="/foundry-art/account/orders/">Orders</a>
        <a href="/foundry-art/account/addresses/">Addresses</a>
        <a href="/foundry-art/account/details/">Details</a>
        <a href="#" data-sign-out>Sign out</a>
      </nav>

      <section class="account-main">
        <div class="account-cards">
          <article class="summary-card">
            <h3>Latest order</h3>
            <div data-latest-order></div>
          </article>
          <article class="summary-card trade-status-card" data-trade-status></article>
          <article class="summary-card">
            <h3>Default address</h3>
            <div data-address-summary></div>
            <a class="btn-secondary" href="/foundry-art/account/addresses/">Manage addresses</a>
          </article>
        </div>
      </section>
    </div>
  </main>

  <div data-footer></div>

  <script src="/assets/products.js?v=20260718-231"></script>
