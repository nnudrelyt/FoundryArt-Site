<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order — Foundry Art</title>
<meta name="description" content="Foundry Art order detail.">
<meta name="theme-color" content="#142528">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23142528'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='400' fill='%23B7997E' text-anchor='middle'%3EFA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css?v=20260719-247">
<link rel="stylesheet" href="/assets/styles.css?v=20260719-247">
</head>
<body data-page="account-order" data-account>

  <div data-nav></div>

  <main class="page">
    <header class="page-header">
      <h1 class="page-title">Order <span data-order-id></span></h1>
      <p class="page-sub">Placed <span data-order-date></span> · <span data-order-status></span></p>
    </header>

    <div class="account-layout">
      <nav class="account-nav" aria-label="Account">
        <a href="/foundry-art/account/">Overview</a>
        <a href="/foundry-art/account/orders/" class="active">Orders</a>
        <a href="/foundry-art/account/addresses/">Addresses</a>
        <a href="/foundry-art/account/details/">Details</a>
        <a href="#" data-sign-out>Sign out</a>
      </nav>

      <section class="account-main">
        <div data-order-detail>
          <table class="cart-table">
            <thead><tr><th>Item</th><th class="num">Total</th></tr></thead>
            <tbody data-order-rows></tbody>
          </table>

          <aside class="summary-card" aria-label="Order totals">
            <h3>Order summary</h3>
            <div class="summary-row"><span>Subtotal</span><span data-order-subtotal></span></div>
            <div class="summary-row" data-order-discount-row hidden><span>Trade discount</span><span data-order-discount></span></div>
            <div class="summary-row"><span data-order-shipping-label>Shipping</span><span data-order-shipping></span></div>
            <div class="summary-row total"><span>Total</span><span data-order-total></span></div>
            <div class="summary-row"><span>Payment</span><span data-order-payment></span></div>
            <div class="summary-row" data-order-tracking hidden><span>Tracking</span><span data-order-tracking-no></span></div>
            <button type="button" class="btn-secondary" data-print-receipt>Print receipt</button>
          </aside>
        </div>
      </section>
    </div>
  </main>

  <div data-footer></div>

  <script src="/assets/products.js?v=20260719-247"></script>
  <script src="/assets/account-data.js?v=20260719-247"></script>
  <script src="/assets/app.js?v=20260719-247"></script>
</body>
</html>
