<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Foundry Art</title>
<meta name="description" content="Sign in to your Foundry Art account.">
<meta name="theme-color" content="#142528">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23142528'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='400' fill='%23B7997E' text-anchor='middle'%3EFA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css?v=20260826-401">
<link rel="stylesheet" href="/assets/styles.css?v=20260826-401">
</head>
<body data-section="foundry-art" data-page="account-sign-in" data-account>

  <div data-nav></div>

  <main class="page account-auth">
    <header class="page-header">
      <h1 class="page-title" data-auth-title>Sign in</h1>
      <p class="page-sub" data-auth-sub>Access your orders, addresses and trade pricing.</p>
    </header>

    <!-- Sign-in leads. Registration is one link away, swapped in place. -->
    <div class="auth-panel" data-auth-view="signin" aria-label="Sign in">
      <form data-signin-form>
        <div class="form-group full"><label for="si-email">Email address *</label>
          <input id="si-email" type="email" value="avery@studioyarrow.com" required></div>
        <div class="form-group full"><label for="si-pass">Password *</label>
          <input id="si-pass" type="password" value="prototype" required></div>
        <p class="auth-forgot"><a href="#">Forgot your password?</a></p>
        <button type="submit" class="btn-primary auth-submit">Sign in</button>
      </form>
      <p class="auth-switch">New customer?
        <button type="button" class="auth-link" data-auth-to="register">Create an account</button>
      </p>
    </div>

    <div class="auth-panel" data-auth-view="register" aria-label="Create an account" hidden>
      <form data-signin-form>
        <div class="field-grid">
          <div class="form-group"><label for="rg-first">First name *</label><input id="rg-first" type="text"></div>
          <div class="form-group"><label for="rg-last">Last name *</label><input id="rg-last" type="text"></div>
          <div class="form-group full"><label for="rg-email">Email address *</label><input id="rg-email" type="email"></div>
          <div class="form-group full"><label for="rg-pass">Password *</label><input id="rg-pass" type="password"></div>
        </div>
        <button type="submit" class="btn-primary auth-submit">Create account</button>
      </form>
      <p class="auth-switch">Already have an account?
        <button type="button" class="auth-link" data-auth-to="signin">Sign in</button>
      </p>
    </div>
  </main>

  <section class="footer-cta" aria-label="Call to action">
    <div class="footer-cta-text">
      <p class="section-eyebrow">Ready to start?</p>
      <h2>The detail your<br>room is missing.</h2>
      <p>Hand cast in solid bronze. Shipped direct from our Chicago studio.</p>
      <p class="footer-cta-phone">
        <span class="footer-cta-phone-label">Studio direct</span>
        <a href="tel:7737842628">(773) 784-2628</a>
      </p>
    </div>
    <div class="footer-cta-actions">
      <a href="/foundry-art/shop/" class="btn-primary-lg">Shop Now</a>
      <a href="/contact/" class="btn-ghost">Contact the Studio</a>
    </div>
  </section>

  <div data-footer></div>

  <script src="/assets/products.js?v=20260826-401"></script>
  <script src="/assets/account-data.js?v=20260826-401"></script>
  <script src="/assets/app.js?v=20260826-401"></script>
</body>
</html>
